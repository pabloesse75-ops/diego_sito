<!-- ATTENZIONE PROPRIETA' PRIVATA DI SFRISO PAOLO -->

<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <title>Sfriso Diego</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">

    <style>
        body {
            background-color: #46e1ec;
            /* colore di sfondo (azzurro) */
            margin: 0;
            /* rimuove il margine automatico del browser */
            overflow-x: hidden;
            /* BLOCCA lo scorrimento orizzontale causato dai fiori fuori schermo */
            overflow-y: hidden;
            /* nasconde lo scroll verticale */
            height: 100vh;
            /* altezza = 100% della finestra visibile */
            font-family: sans-serif;
            /* un font più pulito e moderno per i testi */
        }

        /* Ottimizzazione testi per renderli grandi e centrati su mobile e PC */
        h1 {
            font-size: 7vw;
            /* Il testo si adatta alla larghezza dello schermo dello smartphone */
            margin: 10px 0;
            color: #333;
        }

        h2 {
            font-size: 5vw;
            margin: 5px 0;
            color: #555;
        }

        h3 {
            font-size: 4vw;
            margin: 5px 0;
            color: #777;
        }

        /* Limite per schermi molto grandi (PC), altrimenti i testi diventerebbero giganti */
        @media (min-width: 768px) {
            h1 {
                font-size: 40px;
            }

            h2 {
                font-size: 24px;
            }

            h3 {
                font-size: 18px;
            }
        }

        /* . = classe → si applica a tutti i fiori */
        .fiore {
            position: absolute;
            /* posizione libera */
            bottom: 20px;
            /* 20px dal fondo */
            width: 65px;
            /* Proporzione perfetta su mobile */
            user-select: none;
            /* non selezionabile */
        }

        /* # = ID → elemento unico (il gatto) */
        #gatto-fisso {
            position: absolute;
            bottom: 15px;
            left: 50%;
            /* centro orizzontale */
            transform: translateX(-50%);
            /* correzione per centratura perfetta */
            width: 140px;
            /* Proporzione perfetta per smartphone */
            z-index: 1000;
            /* Il gatto è sempre in primo piano rispetto ai fiori */
        }

        /* Un piccolo tocco estetico: l'erba */
        #pavimento {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background-color: #2ecc71;
            /* Verde prato */
        }
    </style>

    <script>
        const FioriDisponibili = ["fi_0.gif", "fi_1.gif", "fi_2.gif", "fi_3.gif", "fi_4.gif", "fi_5.gif", "fi_6.gif", "fi_7.gif", "fi_8.gif", "fi_9.gif", "fi_10.gif", "fi_11.gif"];
        const GattoImg = "ga_0.gif";

        function Start() {
            // 1. Creiamo il gatto al centro dello schermo
            let gatto = document.createElement("img");
            gatto.src = GattoImg;
            gatto.id = "gatto-fisso";
            document.body.appendChild(gatto);

            // 2. TRUCCO: Creiamo subito 15 fiori posizionati già DENTRO lo schermo all'avvio
            for (let i = 0; i < 15; i++) {
                let giaDentroSchermo = true;
                creaSingoloFiore(giaDentroSchermo);
            }

            // 3. Facciamo partire il ciclo infinito di nascita dei fiori da destra
            generaCicloFiori();
        }

        function generaCicloFiori() {
            // Qui i nuovi fiori nascono normalmente da fuori schermo (false)
            creaSingoloFiore(false);
            let attesa = Math.random() * 100 + 50;
            setTimeout(generaCicloFiori, attesa);
        }

        // Gestione del singolo fiore (può nascere dentro lo schermo o fuori a destra)
        function creaSingoloFiore(iniziale) {
            let f = document.createElement("img");
            let indice = Math.floor(Math.random() * FioriDisponibili.length);
            f.src = FioriDisponibili[indice];
            f.className = "fiore";
            document.body.appendChild(f);

            // Se iniziale = true, lo spargiamo casualmente sullo schermo. Altrimenti parte da destra (+100)
            let posX;
            if (iniziale) {
                posX = Math.random() * window.innerWidth;
            } else {
                posX = window.innerWidth + 100;
            }

            let velocita = 1 + Math.random() * 2;

            function muoviti() {
                posX -= velocita;
                f.style.left = posX + "px";

                if (posX > -150) {
                    requestAnimationFrame(muoviti);
                } else {
                    f.remove(); // Quando esce a sinistra si cancella per non intasare la memoria
                }
            }

            requestAnimationFrame(muoviti);
        }
    </script>
</head>

<body onload="Start()">
    <center>
        <div style="padding-top: 5vh;">
            <h1>SFRISO DIEGO</h1>
            <h1>FILIPPO VALENTINA</h1>
            <h1>SFRISO EVA</h1>
            <h2>Via Dante, 78A</h2>
            <h3>Mirano (VE) Italy</h3>
        </div>
    </center>

    <div id="pavimento"></div>
</body>

</html>
