<!-- ATTENZIONE PROPRIETA' PRIVATA DI SFRISO PAOLO -->

<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <title>Sfriso Diego</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">

    <style>
        body {
            background-color: #46e1ec;
            margin: 0;
            overflow-x: hidden;
            /* Blocca lo sbandamento laterale dei fiori */
            overflow-y: hidden;
            height: 100vh;
            font-family: sans-serif;
        }

        h1 {
            font-size: 7vw;
            margin: 10px 0;
            color: #333;
        }

        h2 {
            font-size: 5vw;
            margin: 5px 0;
            color: #555;
        }

        h3 {
            font-size: 4vw;
            margin: 5px 0;
            color: #777;
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 40px;
            }

            h2 {
                font-size: 24px;
            }

            h3 {
                font-size: 18px;
            }
        }

        .fiore {
            position: absolute;
            bottom: 20px;
            width: 65px;
            user-select: none;
        }

        #gatto-fisso {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            z-index: 1000;
        }

        #pavimento {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background-color: #2ecc71;
        }
    </style>

    <script>
        const FioriDisponibili = ["fi_0.gif", "fi_1.gif", "fi_2.gif", "fi_3.gif", "fi_4.gif", "fi_5.gif", "fi_6.gif", "fi_7.gif", "fi_8.gif", "fi_9.gif", "fi_10.gif", "fi_11.gif"];
        const GattoImg = "ga_0.gif";

        function Start() {
            let gatto = document.createElement("img");
            gatto.src = GattoImg;
            gatto.id = "gatto-fisso";
            document.body.appendChild(gatto);

            generaCicloFiori();
        }

        function generaCicloFiori() {
            creaSingoloFiore();
            let attesa = Math.random() * 100 + 50;
            setTimeout(generaCicloFiori, attesa);
        }

        function creaSingoloFiore() {
            let f = document.createElement("img");
            let indice = Math.floor(Math.random() * FioriDisponibili.length);
            f.src = FioriDisponibili[indice];
            f.className = "fiore";
            document.body.appendChild(f);

            let posX = window.innerWidth + 100;
            let velocita = 1 + Math.random() * 2;

            function muoviti() {
                posX -= velocita;
                f.style.left = posX + "px";

                if (posX > -150) {
                    requestAnimationFrame(muoviti);
                } else {
                    f.remove();
                }
            }

            requestAnimationFrame(muoviti);
        }
    </script>
</head>

<body onload="Start()">
    <center>
        <div style="padding-top: 5vh;">
            <h1>SFRISO DIEGO</h1>
            <h1>FILIPPO VALENTINA</h1>
            <h1>SFRISO EVA</h1>
            <h2>Via Dante, 78A</h2>
            <h3>Mirano (VE) Italy</h3>
        </div>
    </center>

    <div id="pavimento"></div>
</body>

</html>
