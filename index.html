
<!-- ATTENZIONE PROPRIETA' PRIVATA DI SFRISO PAOLO -->
 
<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <title>Sfriso Diego</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">

    <style>
        body {
            background-color: #46e1ec;
            /* colore di sfondo (azzurro) */
            margin: 0;
            /* rimuove il margine automatico del browser */
            overflow-x: hidden;
            /* BLOCCA lo scorrimento orizzontale */
            overflow-y: hidden;
            /* nasconde lo scroll verticale */
            height: 100vh;
            /* altezza = 100% della finestra visibile */
            font-family: sans-serif;
            /* un font più pulito e moderno per i testi */
        }

        /* Ottimizzazione testi per renderli grandi e centrati su mobile e PC */
        h1 {
            font-size: 7vw;
            /* Il testo si adatta alla larghezza dello schermo dello smartphone */
            margin: 10px 0;
            color: #333;
        }

        h2 {
            font-size: 5vw;
            margin: 5px 0;
            color: #555;
        }

        h3 {
            font-size: 4vw;
            margin: 5px 0;
            color: #777;
        }

        /* Stile specifico per la data e l'ora */
        #data-ora {
            font-size: 4.5vw;
            font-weight: bold;
            margin-top: 15px;
            color: #2c3e50;
            background-color: rgba(255, 255, 255, 0.4);
            /* Un leggero sfondo semitrasparente per leggerlo meglio */
            padding: 10px 20px;
            border-radius: 15px;
            display: inline-block;
            line-height: 1.4;
            /* Dona un po' di respiro tra la data e l'ora a capo */
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 40px;
            }

            h2 {
                font-size: 24px;
            }

            h3 {
                font-size: 18px;
            }

            #data-ora {
                font-size: 20px;
            }
        }

        /* . = classe → si applica a tutti i fiori */
        .fiore {
            position: absolute;
            /* posizione libera */
            width: 65px;
            /* Proporzione perfetta su mobile */
            user-select: none;
            /* non selezionabile */
        }

        /* # = ID → elemento unico (il gatto) */
        #gatto-fisso {
            position: absolute;
            bottom: 15px;
            left: 50%;
            /* centro orizzontale */
            transform: translateX(-50%);
            /* correzione per centratura perfetta */
            width: 140px;
            /* Proporzione perfetta per smartphone */
            z-index: 1000;
            /* Il gatto è sempre in primo piano rispetto ai fiori */
        }

        /* Un piccolo tocco estetico: l'erba */
        #pavimento {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background-color: #2ecc71;
            /* Verde prato */
        }
    </style>

    <script>
        const FioriDisponibili = ["fi_0.gif", "fi_1.gif", "fi_2.gif", "fi_3.gif", "fi_4.gif", "fi_5.gif", "fi_6.gif", "fi_7.gif", "fi_8.gif", "fi_9.gif", "fi_10.gif", "fi_11.gif"];
        const GattoImg = "ga_0.gif";

        // MODIFICA: Alzato a 65 per un effetto prato ricchissimo e super fiorito!
        const TOTALE_FIORI = 65;

        function Start() {
            // 1. Creiamo il gatto al centro dello schermo
            let gatto = document.createElement("img");
            gatto.src = GattoImg;
            gatto.id = "gatto-fisso";
            document.body.appendChild(gatto);

            // 2. Distribuzione scaglionata all'avvio dei fiori
            for (let i = 0; i < TOTALE_FIORI; i++) {
                // Li distribuiamo lungo lo schermo e anche oltre a destra, per un flusso continuo
                let xIniziale = Math.random() * (window.innerWidth + 1000);
                creaFioreContinuo(xIniziale);
            }

            // 3. Facciamo partire l'orologio in tempo reale
            aggiornaDataOra();
            setInterval(aggiornaDataOra, 1000);
        }

        function aggiornaDataOra() {
            const adesso = new Date();
            const opzioniData = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            let dataFormattata = adesso.toLocaleDateString('it-IT', opzioniData);
            dataFormattata = dataFormattata.charAt(0).toUpperCase() + dataFormattata.slice(1);

            const ore = String(adesso.getHours()).padStart(2, '0');
            const minuti = String(adesso.getMinutes()).padStart(2, '0');
            const secondi = String(adesso.getSeconds()).padStart(2, '0');
            const oraFormattata = "Ora: " + ore + ":" + minuti + ":" + secondi;

            document.getElementById('data-ora').innerHTML = dataFormattata + "<br>" + oraFormattata;
        }

        function creaFioreContinuo(posizioneXIniziale) {
            let f = document.createElement("img");

            function resettaFiore(elemento) {
                let indice = Math.floor(Math.random() * FioriDisponibili.length);
                elemento.src = FioriDisponibili[indice];
                elemento.className = "fiore";

                // TRUCCO TRIDIMENSIONALE: Ogni fiore si posiziona a un'altezza leggermente diversa sull'erba (tra 10px e 35px dal fondo)
                let altezzaCasuale = 10 + Math.floor(Math.random() * 25);
                elemento.style.bottom = altezzaCasuale + "px";

                // Mettiamo i fiori più in basso davanti a quelli più in alto (ordine visivo naturale)
                elemento.style.zIndex = 100 - altezzaCasuale;
            }

            resettaFiore(f);
            document.body.appendChild(f);

            let posX = posizioneXIniziale;
            // Velocità leggermente diverse per non farli muovere a blocchi rigidi
            let velocita = 0.6 + Math.random() * 1.2;

            function muoviti() {
                posX -= velocita;
                f.style.left = posX + "px";

                if (posX > -100) {
                    requestAnimationFrame(muoviti);
                } else {
                    // Quando esce, rinasce in una coda flessibile a destra fuori schermo
                    posX = window.innerWidth + Math.random() * 100;
                    velocita = 0.6 + Math.random() * 1.2;
                    resettaFiore(f);
                    requestAnimationFrame(muoviti);
                }
            }

            requestAnimationFrame(muoviti);
        }
    </script>
</head>

<body onload="Start()">
    <center>
        <div style="padding-top: 5vh;">
            <h1>SFRISO DIEGO</h1>
            <h1>FILIPPO VALENTINA</h1>
            <h1>SFRISO EVA</h1>
            <h2>Via Dante, 78A</h2>
            <h3>Mirano (VE) Italy</h3>

            <div id="data-ora">Caricamento data...</div>
        </div>
    </center>

    <div id="pavimento"></div>
</body>

</html>
